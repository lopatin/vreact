name = "VReact"
version = "0.1.0"
defaultTargets = ["VReact", "vreact-proofcheck"]

[[lean_lib]]
name = "VReact"

# the whitelist check of user proof files (see ProofCheck.lean); run by `vreact` before Lean
# elaborates them
[[lean_exe]]
name = "vreact-proofcheck"
root = "ProofCheck"
supportInterpreter = true
